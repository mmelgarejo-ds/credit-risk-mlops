# Análisis de calidad de código con SonarQube Cloud.
#
# El flujo reproduce el pipeline completo en cada push: entrena el modelo,
# ejecuta la suite de tests y envía el reporte de cobertura al análisis.
name: SonarQube

on:
  push:
    branches:
      - main
      - developer
      - certification
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Tests y análisis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # El historial completo mejora la relevancia del análisis
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Entrenar el modelo
        # modelo_final.pkl no se versiona: se genera desde el pipeline, que es
        # lo que garantiza que el artefacto corresponde al código del commit.
        working-directory: mlops_pipeline/src
        run: python model_training_evaluation.py

      - name: Ejecutar tests con cobertura
        run: pytest --cov=mlops_pipeline/src --cov-report=xml

      - name: Análisis SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
