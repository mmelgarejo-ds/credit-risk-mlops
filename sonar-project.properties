sonar.projectKey=mmelgarejo-ds_credit-risk-mlops
sonar.organization=mmelgarejo-ds
sonar.projectName=credit-risk-mlops

# Código a analizar y tests, declarados por separado
sonar.sources=mlops_pipeline/src
sonar.tests=mlops_pipeline/tests

# Reporte generado por pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Los notebooks documentan el análisis exploratorio; no son código productivo
sonar.exclusions=**/*.ipynb,**/venv/**

sonar.sourceEncoding=UTF-8
